name: Deploy to GitHub Pages

on:
  push:
    branches: [editorial]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # The build runs scripts/check-content.ts directly, which needs Node 22.18 or later.
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run build -- --base=/portfolio/
      # Pages serves 404.html at the requested URL, so deep links reach the router.
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
